services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: &app-environment
      MONGO_CONNECTION_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo_root}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_pass}@mongo:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-example_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_WORKERS: 1
      AUTO_RELOAD: 'false'
      DEBUG: 'false'
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: ['python', 'worker.py']
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 40s

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_pass}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
